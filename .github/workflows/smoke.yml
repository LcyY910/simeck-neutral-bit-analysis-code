name: repository-files

on:
  push:
  pull_request:

jobs:
  verify-files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check archived files
        shell: bash
        run: |
          set -euo pipefail
          test -f SHA256SUMS.txt

          missing=0
          while IFS= read -r line; do
            line="${line%$'\r'}"
            path="${line#*  }"
            if [[ ! -f "$path" ]]; then
              echo "::error file=$path::Missing archived file"
              missing=1
            fi
          done < SHA256SUMS.txt

          exit "$missing"
